<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>Comride — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
    a, button, [onclick] { cursor: pointer; }
    @keyframes slideUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
    @keyframes likeBlip { 0%,100%{transform:scale(1)} 40%{transform:scale(1.45)} 70%{transform:scale(0.88)} }
    @keyframes toastIn { from{opacity:0;transform:translate(-50%,12px)} to{opacity:1;transform:translate(-50%,0)} }
    @keyframes sheetUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .page-body { animation: slideUp 0.35s ease both; }

    @keyframes btnGlow {
      0%,100% { box-shadow: 0 0 24px rgba(226,255,59,0.3); }
      50%     { box-shadow: 0 0 48px rgba(226,255,59,0.6); }
    }

    html, body { background: #000; color: #fff; font-family: 'Manrope', sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; }
    ::selection { background: #E2FF3B; color: #2A3000; }

    .input-wrap {
      display: flex; align-items: center; gap: 12px;
      background: #191919; border-radius: 12px; padding: 16px 18px;
      border: 1.5px solid transparent; transition: border-color 0.2s;
    }
    .input-wrap:focus-within { border-color: #E2FF3B; }

    .field-input {
      flex: 1; font-family: 'Manrope', sans-serif; font-size: 14px;
      color: #fff; background: transparent; border: none; outline: none;
    }
    .field-input::placeholder { color: #ababab; }

    .pw-toggle {
      background: none; border: none; color: #ababab; font-size: 13px;
      cursor: pointer; padding: 0; font-family: 'Manrope', sans-serif; font-weight: 600;
      letter-spacing: 0.5px; white-space: nowrap;
    }
    .pw-toggle:hover { color: #E2FF3B; }

    .tab-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
      border: none; border-radius: 9999px; padding: 14px;
      font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 14px;
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .cta-btn {
      width: 100%; border: none; border-radius: 9999px; padding: 18px;
      font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 14px;
      letter-spacing: 2px; text-transform: uppercase; color: #000;
      background: #E2FF3B; cursor: pointer;
      animation: btnGlow 2.5s ease infinite;
      transition: opacity 0.15s, transform 0.1s;
    }
    .cta-btn:active { transform: scale(0.97); }

    .social-btn {
      flex: 1; display: flex; align-items: center; justify-content: center;
      background: #191919; border: none; border-radius: 12px; height: 56px;
      cursor: pointer; transition: background 0.15s, border-color 0.15s;
      border: 1px solid transparent;
    }
    .social-btn:hover { background: #222; border-color: rgba(255,255,255,0.1); }

    .divider-line { flex: 1; height: 1px; background: #484848; }
    .divider-text {
      font-family: 'Manrope', sans-serif; font-size: 10px; letter-spacing: 2px;
      text-transform: uppercase; color: #484848; white-space: nowrap;
    }
  </style>
</head>
<body style="background:#000;color:#fff">

  <!-- HERO IMAGE -->
  <div style="position:relative;width:100%;height:240px;overflow:hidden;max-width:390px;margin:0 auto;">
    <img src="https://images.unsplash.com/photo-1519003300449-424ad0405076?w=800&auto=format&fit=crop&q=80" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block;" />
    <div style="position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,1) 85%);pointer-events:none;"></div>
  </div>

  <div style="max-width:390px;margin:0 auto;min-height:calc(100vh - 240px);padding:0 12px 60px;margin-top:-40px;position:relative;z-index:2" class="page-body">

    <!-- Back -->
    <a href="splash.html" style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:#fff;font-size:18px;text-decoration:none;margin-bottom:32px">←</a>

    <!-- Logo Area -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:40px">
      <img src="comride.svg" alt="Comride" style="height:32px" />
      <p style="font-family:'Manrope',sans-serif;font-size:14px;color:#ababab;margin:0;text-align:center">
        Sign in to continue your journey
      </p>
    </div>

    <!-- Tab Switcher -->
    <div style="display:flex;gap:8px;width:100%;margin-bottom:32px">
      <button id="tab-phone" class="tab-btn" onclick="switchTab('phone')" style="background:#E2FF3B;color:#000">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.76a19.79 19.79 0 01-3.07-8.67A2 2 0 012 .99h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 8.96a16 16 0 006.12 6.12l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
        Phone
      </button>
      <button id="tab-email" class="tab-btn" onclick="switchTab('email')" style="background:#191919;color:#ababab">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        Email
      </button>
    </div>

    <!-- Phone Section -->
    <div id="phone-section">
      <label style="display:block;font-family:'Manrope',sans-serif;font-weight:700;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#ababab;margin-bottom:8px">PHONE NUMBER</label>
      <div class="input-wrap">
        <span onclick="showToast('Country code picker coming soon')" style="font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;color:#fff;padding-right:12px;border-right:1px solid rgba(72,72,72,0.3);white-space:nowrap;cursor:pointer">+91 ▾</span>
        <input class="field-input" type="tel" placeholder="Enter mobile number" id="phone-input" />
      </div>
    </div>

    <!-- Email Section (hidden) -->
    <div id="email-section" style="display:none">
      <label style="display:block;font-family:'Manrope',sans-serif;font-weight:700;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#ababab;margin-bottom:8px">EMAIL ADDRESS</label>
      <div class="input-wrap" style="margin-bottom:16px">
        <input class="field-input" type="email" placeholder="Enter your email" id="email-input" />
      </div>
      <label style="display:block;font-family:'Manrope',sans-serif;font-weight:700;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#ababab;margin-bottom:8px">PASSWORD</label>
      <div class="input-wrap">
        <input class="field-input" type="password" placeholder="Enter your password" id="pw-input" />
        <button class="pw-toggle" onclick="togglePassword(document.getElementById('pw-input'))">SHOW</button>
      </div>
      <div style="text-align:right;margin-top:8px">
        <span onclick="showToast('Password reset link sent!')" style="font-family:'Manrope',sans-serif;font-size:12px;color:#E2FF3B;cursor:pointer;font-weight:600">Forgot password?</span>
      </div>
    </div>

    <div style="height:32px"></div>

    <!-- CTA -->
    <button id="cta-btn" class="cta-btn" onclick="submitLogin(this)">SEND OTP</button>

    <div style="height:40px"></div>

    <!-- OR Divider -->
    <div style="display:flex;align-items:center;gap:16px">
      <div class="divider-line"></div>
      <span class="divider-text">OR CONTINUE WITH</span>
      <div class="divider-line"></div>
    </div>

    <div style="height:24px"></div>

    <!-- Social Auth -->
    <div style="display:flex;gap:12px;justify-content:center">
      <button class="social-btn" onclick="showToast('Signing in with Google...')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
      </button>
      <button class="social-btn" onclick="showToast('Signing in with Apple...')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
        </svg>
      </button>
      <button class="social-btn" onclick="showToast('Signing in with Facebook...')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#1877F2">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
      </button>
    </div>

    <div style="height:48px"></div>

    <!-- Sign Up Link -->
    <p style="text-align:center;font-family:'Manrope',sans-serif;font-size:14px;color:#ababab;margin:0">
      Don't have an account?&nbsp;<span style="font-weight:700;color:#E2FF3B;cursor:pointer" onclick="location.href='profile-setup.html'">Sign Up →</span>
    </p>

  </div>

  <script>
    function switchTab(tab) {
      const phoneTab = document.getElementById('tab-phone');
      const emailTab = document.getElementById('tab-email');
      const phoneSection = document.getElementById('phone-section');
      const emailSection = document.getElementById('email-section');
      const ctaBtn = document.getElementById('cta-btn');

      if (tab === 'phone') {
        phoneTab.style.background = '#E2FF3B'; phoneTab.style.color = '#000';
        emailTab.style.background = '#191919'; emailTab.style.color = '#ababab';
        phoneSection.style.display = 'block';
        emailSection.style.display = 'none';
        ctaBtn.textContent = 'SEND OTP';
      } else {
        emailTab.style.background = '#E2FF3B'; emailTab.style.color = '#000';
        phoneTab.style.background = '#191919'; phoneTab.style.color = '#ababab';
        emailSection.style.display = 'block';
        phoneSection.style.display = 'none';
        ctaBtn.textContent = 'SIGN IN';
      }
    }

    function submitLogin(btn) {
      btn.textContent = 'SIGNING IN...';
      btn.style.opacity = '0.7';
      setTimeout(() => location.href = 'onboarding.html', 1400);
    }

    function togglePassword(input) {
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      const btn = input.nextElementSibling;
      if (btn) btn.textContent = isPassword ? 'HIDE' : 'SHOW';
    }
  </script>

  <script>
    document.querySelectorAll('a,button,[onclick]').forEach(function(el){
      el.addEventListener('mousedown',function(){this.style.opacity='0.75';},{passive:true});
      el.addEventListener('mouseup',function(){this.style.opacity='';},{passive:true});
      el.addEventListener('mouseleave',function(){this.style.opacity='';},{passive:true});
      el.addEventListener('touchstart',function(){this.style.opacity='0.75';},{passive:true});
      el.addEventListener('touchend',function(){this.style.opacity='';},{passive:true});
      el.addEventListener('touchcancel',function(){this.style.opacity='';},{passive:true});
    });
    window.showToast=function(msg,isError){
      document.querySelectorAll('.toast-msg').forEach(t=>t.remove());
      const t=document.createElement('div');
      t.className='toast-msg';t.textContent=msg;
      t.style.cssText=`position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:${isError?'#ff4444':'#E2FF3B'};color:${isError?'#fff':'#000'};font-family:'Manrope',sans-serif;font-size:13px;font-weight:700;padding:10px 20px;border-radius:12px;z-index:9999;pointer-events:none;animation:toastIn 0.3s ease;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.4)`;
      document.body.appendChild(t);
      setTimeout(()=>t.remove(),2200);
    };
  </script>
<script src="journey-mode.js"></script>
</body>
</html>
