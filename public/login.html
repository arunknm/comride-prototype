<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Comride — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { background: #000; color: #fff; font-family: 'Manrope', sans-serif; -webkit-font-smoothing: antialiased; }
    ::selection { background: #E2FF3B; color: #2A3000; }
  </style>
</head>
<body style="background:#000;color:#fff">
  <div style="max-width:390px;margin:0 auto;min-height:100vh;padding:60px 24px 60px">

    <!-- Logo Area -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
      <img src="/comride.svg" alt="Comride" style="height:32px" />
      <p style="font-family:'Manrope',sans-serif;font-size:14px;color:#ababab;margin:0;text-align:center">
        Sign in to your account to continue
      </p>
    </div>

    <!-- Gap -->
    <div style="height:48px"></div>

    <!-- Tab Switcher -->
    <div style="display:flex;gap:8px;width:100%">
      <button id="tab-phone" onclick="switchTab('phone')" style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:#E2FF3B;color:#000;border:none;border-radius:9999px;padding:14px;font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;cursor:pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.76a19.79 19.79 0 01-3.07-8.67A2 2 0 012 .99h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 8.96a16 16 0 006.12 6.12l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
        </svg>
        Phone
      </button>
      <button id="tab-email" onclick="switchTab('email')" style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:#191919;color:#ababab;border:none;border-radius:9999px;padding:14px;font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;cursor:pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        Email
      </button>
    </div>

    <!-- Gap -->
    <div style="height:32px"></div>

    <!-- Phone Input Section -->
    <div id="phone-section">
      <label style="display:block;font-family:'Manrope',sans-serif;font-weight:700;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#ababab">
        PHONE NUMBER
      </label>
      <div style="height:8px"></div>
      <div style="display:flex;align-items:center;gap:12px;background:#191919;border-radius:12px;padding:18px">
        <span style="font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;color:#fff;padding-right:12px;border-right:1px solid rgba(72,72,72,0.3);white-space:nowrap;cursor:pointer">+1 ▾</span>
        <input type="tel" placeholder="Enter mobile number" style="flex:1;font-family:'Manrope',sans-serif;font-size:14px;color:#ababab;background:transparent;border:none;outline:none" />
      </div>
    </div>

    <!-- Email Input Section (hidden by default) -->
    <div id="email-section" style="display:none">
      <label style="display:block;font-family:'Manrope',sans-serif;font-weight:700;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#ababab">
        EMAIL ADDRESS
      </label>
      <div style="height:8px"></div>
      <div style="display:flex;align-items:center;background:#191919;border-radius:12px;padding:18px">
        <input type="email" placeholder="Enter your email" style="flex:1;font-family:'Manrope',sans-serif;font-size:14px;color:#ababab;background:transparent;border:none;outline:none" />
      </div>
    </div>

    <!-- Gap -->
    <div style="height:32px"></div>

    <!-- Send OTP / Continue Button -->
    <button id="cta-btn" style="width:100%;background:#E2FF3B;box-shadow:0 0 32px rgba(226,255,59,0.4);border-radius:9999px;padding:18px;border:none;font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:#000;cursor:pointer">
      SEND OTP
    </button>

    <!-- Gap -->
    <div style="height:40px"></div>

    <!-- OR Divider -->
    <div style="display:flex;align-items:center;gap:16px">
      <div style="flex:1;height:1px;background:#484848"></div>
      <span style="font-family:'Manrope',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#484848;white-space:nowrap">OR CONTINUE WITH</span>
      <div style="flex:1;height:1px;background:#484848"></div>
    </div>

    <!-- Gap -->
    <div style="height:24px"></div>

    <!-- Social Auth Row -->
    <div style="display:flex;gap:16px;justify-content:center">
      <!-- Google -->
      <button style="flex:1;display:flex;align-items:center;justify-content:center;background:#191919;border:none;border-radius:16px;height:56px;cursor:pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
      </button>
      <!-- Apple -->
      <button style="flex:1;display:flex;align-items:center;justify-content:center;background:#191919;border:none;border-radius:16px;height:56px;cursor:pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
        </svg>
      </button>
      <!-- Facebook -->
      <button style="flex:1;display:flex;align-items:center;justify-content:center;background:#191919;border:none;border-radius:16px;height:56px;cursor:pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#1877F2">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
      </button>
    </div>

    <!-- Gap -->
    <div style="height:48px"></div>

    <!-- Bottom Sign Up Link -->
    <p style="text-align:center;font-family:'Manrope',sans-serif;font-size:14px;color:#ababab;margin:0">
      Don't have an account?&nbsp;<span style="font-weight:700;color:#E2FF3B;cursor:pointer">Sign Up</span>
    </p>

  </div>

  <script>
    function switchTab(tab) {
      const phoneTab = document.getElementById('tab-phone');
      const emailTab = document.getElementById('tab-email');
      const phoneSection = document.getElementById('phone-section');
      const emailSection = document.getElementById('email-section');
      const ctaBtn = document.getElementById('cta-btn');

      if (tab === 'phone') {
        phoneTab.style.background = '#E2FF3B';
        phoneTab.style.color = '#000';
        emailTab.style.background = '#191919';
        emailTab.style.color = '#ababab';
        phoneSection.style.display = 'block';
        emailSection.style.display = 'none';
        ctaBtn.textContent = 'SEND OTP';
      } else {
        emailTab.style.background = '#E2FF3B';
        emailTab.style.color = '#000';
        phoneTab.style.background = '#191919';
        phoneTab.style.color = '#ababab';
        emailSection.style.display = 'block';
        phoneSection.style.display = 'none';
        ctaBtn.textContent = 'CONTINUE';
      }
    }
  </script>
</body>
</html>
